# data-path-9 machine catalog
# Structured metadata for every entry in README.md (the human-facing shelf).
# Every field verified against GitHub REST API on 2026-10-09.
# Agents: trust this file over prose. Humans: read the README.
# Status enum: breathing | quiet | orphaned | archived | moved | vanished
# 41 original records (two shelves carry a companion record each), plus the
# fork wing — copies we hold of upstream tools: 26 from the 10-09 pilot and
# the remaining 201 in the same-day full sweep, same verification date.
# `held_fork` names the copy in this account; statuses describe the UPSTREAM.
# sweep copies carry `copy_shelf` when their nature matches a founding shelf
# (voice clone -> speech, photoshop-reimpl -> text-to-image, agent harness ->
# chat-agents...). copies with no founding ancestor — the agent-era ecosystem
# that is the fork wing — stay unassigned and group under the fork wing.


